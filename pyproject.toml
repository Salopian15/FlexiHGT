[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FlexiHGT"
version = "0.2.0"
description = "A rapid HGT detection tool based on HGTphyloDetect, using DIAMOND/MMseqs2 and offline ete3 taxonomy with user-selectable taxonomic levels."
readme = "README.md"
license = { file = "LICENSE" }
# ete3 is unmaintained and does not install cleanly on 3.13+ (it still relies on
# distutils). Pin the supported range rather than letting pip pick a broken combo.
requires-python = ">=3.9,<3.13"
authors = [{ name = "Jack A. Crosby", email = "jac180@aber.ac.uk" }]
keywords = ["bioinformatics", "horizontal gene transfer", "HGT", "genomics", "taxonomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "ete3>=3.1.2",
    # ete3 imports six at runtime but does not declare it.
    "six",
]

[project.optional-dependencies]
test = ["pytest>=7", "pyarrow>=10", "duckdb>=0.10"]
# pyarrow: ~2.3x faster hit-table parsing, and the annotated-hits cache that
# lets threshold sweeps skip parsing and taxonomy entirely.
cache = ["pyarrow>=10"]
# duckdb: out-of-core scoring for hit tables too large to fit in memory.
bigdata = ["duckdb>=0.10", "pyarrow>=10"]
# taxopy: faster, maintained alternative to the ete3 taxonomy backend.
taxopy = ["taxopy>=0.12"]

[project.urls]
Homepage = "https://github.com/Salopian15/FlexiHGT"
Issues = "https://github.com/Salopian15/FlexiHGT/issues"

[project.scripts]
flexihgt = "flexihgt.cli:main"
flexihgt-multi = "flexihgt.multi_cli:main"

[tool.setuptools]
packages = ["flexihgt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
